version: 2

models:
  - name: mart_customer_orders
    description: "Customer order summary for analytics team"
    columns:
      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of orders per customer"
        tests:
          - not_null
      - name: total_amount
        description: "Total spend before tax"
        tests:
          - not_null
      - name: total_amount_with_tax
        description: "Total spend including tax"
        tests:
          - not_null