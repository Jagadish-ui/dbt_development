version: 2

models:
  - name: my_first_dbt_model
    description: "First dbt model with id and validity flag"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - not_null
          - unique
      - name: is_valid
        description: "Flag indicating if record is valid"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: [true, false]
      - name: id_doubled
        description: "Flag indicating if record is valid"
        tests:
          - not_null