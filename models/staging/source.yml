version: 2

sources:
  - name: raw
    database: DEV
    schema: RAW
    tables:
      - name: raw_orders
        description: "Raw orders loaded by ingestion tool"
        columns:
          - name: order_id
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null